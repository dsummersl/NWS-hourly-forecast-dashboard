output: demo.webm
viewport:
  width: 1280
  height: 720
cursor: true
url: file:///Users/danesummers/Documents/classes/agentexperiments/main/nws-forecast-viz/video-demo/slides/slide.001.png
scenes:
  - name: Title slide
    do:
      - pause: 3
      - screenshot: 00-title.png

  - name: Chapter 1 — The Original NWS Page
    open: file:///Users/danesummers/Documents/classes/agentexperiments/main/nws-forecast-viz/video-demo/slides/slide.002.png
    do:
      - pause: 3.5

  - name: Live — NWS Original Graphical Forecast
    open: https://forecast.weather.gov/MapClick.php?w0=t&w1=td&w2=hi&w3=sfcwind&w3u=1&w4=sky&w5=pop&w6=rh&w7=rain&w8=thunder&w9=fog&w10u=0&w11u=1&w12u=1&AheadHour=3&Submit=Submit&FcstType=graphical&textField1=36.0746&textField2=-79.0964&site=all&unit=0&dd=&bw=
    wait_for: body >> nth=0
    do:
      - pause: 2
      - scroll: {y: 0, duration: 0.3}
      - pause: 1.5
      - scroll: {y: 500, duration: 2}
      - pause: 2
      - scroll: {y: 1200, duration: 2}
      - pause: 3
      - screenshot: 02-nws-original.png

  - name: Live — Reskin Full Page
    open: http://127.0.0.1:3000/
    wait_for: h1 >> nth=0
    do:
      - pause: 4
      - screenshot: 04-reskin-home.png

  - name: Live — Scroll Halfway Down
    open: http://127.0.0.1:3000/
    wait_for: h1 >> nth=0
    do:
      - pause: 1.5
      - scroll: {y: 0, duration: 0.3}
      - pause: 1
      - scroll: {y: 300, duration: 1.5}
      - pause: 1
      - scroll: {y: 500, duration: 1.5}
      - pause: 1
      - scroll: {y: 700, duration: 1.5}
      - pause: 2
      - screenshot: 05-scroll-panels.png

  - name: Live — 48-Hour View
    open: http://127.0.0.1:3000/
    wait_for: h1 >> nth=0
    do:
      - pause: 1.5
      - click: "label:has-text('Next 48 hours')"
      - pause: 3
      - screenshot: 06-48hour-view.png

  - name: Live — 7-Day Full Horizon
    open: http://127.0.0.1:3000/
    wait_for: h1 >> nth=0
    do:
      - pause: 1.5
      - click: "label:has-text('Full 7 days')"
      - pause: 3
      - screenshot: 07-seven-day.png

  - name: Chapter 2 — Data Pipeline
    open: file:///Users/danesummers/Documents/classes/agentexperiments/main/nws-forecast-viz/video-demo/slides/slide.003.png
    do:
      - pause: 4

  - name: Chapter 3 — Interactivity Features
    open: file:///Users/danesummers/Documents/classes/agentexperiments/main/nws-forecast-viz/video-demo/slides/slide.004.png
    do:
      - pause: 4.5

  - name: Chapter 4 — Architecture
    open: file:///Users/danesummers/Documents/classes/agentexperiments/main/nws-forecast-viz/video-demo/slides/slide.005.png
    do:
      - pause: 4.5
